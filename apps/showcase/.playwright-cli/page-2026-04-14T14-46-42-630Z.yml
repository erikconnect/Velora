      - generic [ref=e63]:
        - paragraph [ref=e64]: The Browser-First Paradigm
        - heading "Visual depth without framework overhead." [level=2] [ref=e65]
        - generic [ref=e66]:
          - paragraph [ref=e67]: Velora uses native CSS capabilities, perceptual color relationships and a small set of composable primitives to create editorial-quality pages that still deploy like plain static HTML.
          - paragraph [ref=e68]: "The framework logic is structural: tokens define the material, surfaces express depth, motion attributes add choreography, and scene composition decides pacing."
