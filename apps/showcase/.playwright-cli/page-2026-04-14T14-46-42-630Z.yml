          - heading "Depth by material contrast." [level=2] [ref=e72]
          - paragraph [ref=e73]: Instead of leaning on generic borders and heavy shadows, the framework creates hierarchy through tonal steps and calibrated recessive surfaces.
        - article [ref=e74]:
