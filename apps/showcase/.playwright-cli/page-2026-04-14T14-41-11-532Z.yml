            - text: and staggered children to reinforce reading order, not to decorate every block.
        - article [ref=e82]:
          - paragraph [ref=e83]: Static shipping
          - heading "Deploy the page, not the runtime." [level=2] [ref=e84]
          - paragraph [ref=e85]: The default output is portable HTML and CSS. Progressive enhancement stays isolated from the visual backbone.
