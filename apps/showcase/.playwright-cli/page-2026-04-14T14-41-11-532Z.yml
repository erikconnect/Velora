            - paragraph [ref=e63]: Technical decor
            - paragraph [ref=e64]: Latency tuned, reflow restrained, view transitions promoted only where they add narrative value.
      - generic [ref=e65]:
        - paragraph [ref=e66]: The Browser-First Paradigm
        - heading "Visual depth without framework overhead." [level=2] [ref=e67]
        - generic [ref=e68]:
          - paragraph [ref=e69]: Velora uses native CSS capabilities, perceptual color relationships and a small set of composable primitives to create editorial-quality pages that still deploy like plain static HTML.
          - paragraph [ref=e70]: "The framework logic is structural: tokens define the material, surfaces express depth, motion attributes add choreography, and scene composition decides pacing."
      - generic [ref=e71]:
        - article [ref=e72]:
          - paragraph [ref=e73]: Tonal layering
          - heading "Depth by material contrast." [level=2] [ref=e74]
          - paragraph [ref=e75]: Instead of leaning on generic borders and heavy shadows, the framework creates hierarchy through tonal steps and calibrated recessive surfaces.
        - article [ref=e76]:
          - paragraph [ref=e77]: Kinetic ease
          - heading "Motion that reads as structure." [level=2] [ref=e78]
          - paragraph [ref=e79]:
