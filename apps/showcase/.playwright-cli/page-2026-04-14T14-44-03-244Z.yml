        - complementary [ref=e51]:
          - paragraph [ref=e52]: Blueprint logic
          - list [ref=e53]:
            - listitem [ref=e54]: Separate the visual engine from optional controls.
            - listitem [ref=e55]: Prefer surfaces and spacing before adding ornament.
            - listitem [ref=e56]: Use motion only after hierarchy is already readable at rest.
      - generic [ref=e57]:
        - complementary [ref=e58]:
          - paragraph [ref=e59]: System dossier
          - heading "Four layers. One contract." [level=2] [ref=e60]
          - list [ref=e61]:
            - listitem [ref=e62]: Tokens define material, scale and semantic roles.
            - listitem [ref=e63]: Structures compose shells, grids and section pacing.
            - listitem [ref=e64]: Motion attributes apply choreography declaratively.
            - listitem [ref=e65]: Enhancement scripts stay optional and isolated.
        - generic [ref=e66]:
          - article [ref=e67]:
            - paragraph [ref=e68]: Visual physics
            - heading "The tonal stack creates mechanical depth." [level=2] [ref=e69]
            - paragraph [ref=e72]: Traditional UI stacks shadows. Velora stacks surfaces. Depth is expressed through lightness, recession and the relationship between layers.
          - article [ref=e77]:
            - generic [ref=e78]:
              - paragraph [ref=e79]: Interaction logic
              - heading "Kinetic Actuators" [level=3] [ref=e80]
              - paragraph [ref=e81]: Feedback should feel like resistance in a real interface, not like decorative motion pasted on top.
            - generic [ref=e82]:
              - paragraph [ref=e83]: Scaling rule
              - heading "Extend by tokens" [level=3] [ref=e84]
              - paragraph [ref=e85]: When teams need custom product behavior, they add roles to the system rather than forking page-specific style sheets.
          - article [ref=e86]:
            - paragraph [ref=e87]: Boundaries
            - heading "What belongs inside the framework." [level=2] [ref=e88]
            - generic [ref=e89]:
              - paragraph [ref=e90]: "Inside: tokens, surfaces, typography, structures, interaction states, motion primitives."
              - paragraph [ref=e91]: "Optional: global controls like theme toggles and page transitions for the showcase environment."
              - paragraph [ref=e92]: "Outside: one-off presentation hacks that bypass the semantic system and make pages drift apart."
