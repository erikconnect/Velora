          - paragraph [ref=e42]: Foundational Core
          - heading "Architectural Blueprint" [level=1] [ref=e43]:
            - text: Architectural
            - emphasis [ref=e44]: Blueprint
          - paragraph [ref=e45]: Velora is designed as a browser-first system. Tokens establish material behavior, structures impose rhythm, motion adds kinetic hierarchy, and optional enhancement stays outside the visual backbone.
