          - generic [ref=e53]:
            - article [ref=e54]:
              - paragraph [ref=e55]: Render latency
              - paragraph [ref=e56]: 0.02ms
              - paragraph [ref=e57]: Modules stay in CSS so product pages inherit behavior rather than reconstructing it in runtime code.
            - article [ref=e58]:
              - paragraph [ref=e59]: Execution layer
              - paragraph [ref=e60]: CSS
              - paragraph [ref=e61]: State, density and motion remain predictable because they read from the same token contract.
      - generic [ref=e62]:
        - article [ref=e63]:
          - paragraph [ref=e64]: Tonal layering
          - heading "Visual hierarchy starts with surfaces." [level=2] [ref=e65]
          - paragraph [ref=e66]: The system avoids generic card stacks. Instead, it uses tonal recession, spacing pressure and carefully bounded contrast so each module feels part of one machine.
        - article [ref=e67]:
          - paragraph [ref=e68]: Module health
          - paragraph [ref=e69]: Stable
          - list [ref=e70]:
            - listitem [ref=e71]: Tokens feed the material system.
            - listitem [ref=e72]: Structures establish layout rhythm.
            - listitem [ref=e73]: Motion orchestrates attention after hierarchy exists.
        - article [ref=e74]:
          - paragraph [ref=e75]: Motion
          - heading "Kinetic Ease" [level=2] [ref=e76]
          - paragraph [ref=e77]: Microinteractions and reveal logic belong to the system so scenes can remain rich without page-local animation hacks.
        - article [ref=e78]:
          - paragraph [ref=e79]: Forms
          - heading "Actuator-ready Controls" [level=2] [ref=e80]
          - paragraph [ref=e81]: Inputs and validation inherit spacing, focus and semantic color roles directly from the same framework core.
        - article [ref=e82]:
          - paragraph [ref=e83]: Structures
          - heading "Architectural Primitives" [level=2] [ref=e84]
          - paragraph [ref=e85]: Stacks, grids and shell panels give composition discipline before individual components even enter the page.
        - article [ref=e86]:
          - paragraph [ref=e87]: Composition rules
          - heading "Extend the system, do not fork it." [level=2] [ref=e88]
          - generic [ref=e89]:
            - paragraph [ref=e90]: A module should solve one concern and expose a clear shape for reuse.
            - paragraph [ref=e91]: If a product needs a new pattern, add a new system slice instead of embedding one-off visual logic in a page.
            - paragraph [ref=e92]: The premium feel appears when all slices remain coherent under scenes, themes and density changes.
