name: Publish @velora/css

on:
  workflow_dispatch:
  push:
    tags:
      - "css-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contract
        run: pnpm verify:contract

      - name: Build CSS dist
        run: pnpm --filter @velora/css build

      - name: Check dist
        run: pnpm --filter @velora/css check:dist

      - name: Publish to npm
        working-directory: packages/css
        run: npm publish --provenance --access public
