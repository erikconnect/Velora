<!DOCTYPE html>
<!--
  ┌─────────────────────────────────────────────────────────────────────────────┐
  │  VELORA COMPONENT SHELL                                                     │
  │  ─────────────────────────────────────────────────────────────────────────  │
  │  1. Copy this file → rename (e.g. hero/header2.html)                        │
  │  2. Copy HTML from relume.io/react/components (HTML tab)                    │
  │  3. Paste inside <body> and replace classes with Velora equivalents:        │
  │                                                                             │
  │  KEY VELORA CLASSES                                                         │
  │  Layout:  vl-section · vl-container · vl-container--narrow                 │
  │           vl-stack · vl-cluster · vl-grid · vl-grid--3 · vl-split          │
  │  Type:    vl-kicker · vl-text-gradient · vl-section-header                 │
  │  Motion:  vl-effect="fade-up" · vl-effect="blur-in" · vl-children="stagger"  │
  │           vl-timeline="view" · vl-range="entry" · vl-once                  │
  │           vl-stagger="80ms" · vl-depth="1-4" · vl-speed="slow|fast"       │
  │  Parts:   vl-cta · vl-cta--ghost · vl-card · vl-badge · vl-accordion       │
  │           vl-header · vl-footer · vl-nav · vl-nav__link                    │
  │                                                                             │
  │  INTERACTIVE CONVERSIONS                                                    │
  │  useState toggle   →  <input type="checkbox"> + :has()                     │
  │  AnimatePresence   →  visibility + opacity CSS transition                   │
  │  JS accordion      →  <details name="g"> + .vl-accordion                   │
  │  JS scroll anims   →  vl-effect + vl-timeline="view" on element             │
  │  Framer rotate     →  rotate: Xdeg in component <style>                    │
  │                                                                             │
  │  CSS PATH (serve from packages/ root):                                      │
  │  root level files  →  ../css/src/velora.css                                │
  │  subfolder files   →  ../../css/src/velora.css                             │
  └─────────────────────────────────────────────────────────────────────────────┘
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora — Component Name</title>

    <!-- Google Fonts (drives --vl-font-family and --vl-font-family-display tokens) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Velora CSS (tokens + reset + layout + motion + components + structures) -->
    <!-- root-level files: ../css/src/velora.css  |  subfolder files: ../../css/src/velora.css -->
    <link rel="stylesheet" href="../css/src/velora.css" />

    <!-- Component-specific styles (only for things Velora doesn't cover) -->
    <style>
      /* add custom CSS here */
    </style>
  </head>
  <body>

    <!-- Paste converted component HTML here -->

  </body>
</html>
