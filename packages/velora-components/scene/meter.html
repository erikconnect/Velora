<!DOCTYPE html>
<!--
  VELORA COMPONENT — Meter
  ─────────────────────────────────────────────────────────────
  Progress or intensity indicator used inside side cards, panels
  and metric rows. Communicates relative strength without needing
  JavaScript or runtime measurement.

  API on .showcase-cinema-meter:
    vl-effect     fade-up | reveal-cinematic | glide-in
    vl-timeline   view (when the meter should animate on scroll)
    vl-once       optional — fires entrance only once

  Inner structure:
    span    — Visible metric label
    .showcase-cinema-meter__track
      .showcase-cinema-meter__fill[style="--fill: 72%"]

  Fill values:
    Use either an inline --fill percentage or a provided utility
    class such as .showcase-cinema-meter__fill--72.
    Keep values visible in nearby text when they carry meaning.

  Placement:
    Inside .showcase-cinema-sidecard, .showcase-cinema-panel, or
    compact metric lists. Never use as the only content in a scene.

  Accessibility:
    - Include the value in visible copy when the number matters
    - Add aria-label to the track for compact metric-only layouts
    - Decorative meters can omit ARIA when the label explains intent

  CSS layers consumed:
    velora.components → @layer velora.showcase
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meter — Velora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/src/velora.css" />
  </head>
  <body>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT A: Standard meter
         Single labeled indicator for side cards and panels.
    ───────────────────────────────────────────────────────────── -->
    <div class="showcase-cinema-meter">
      <span>[Metric label]</span>
      <div class="showcase-cinema-meter__track" aria-label="[Metric label]: 72%">
        <span class="showcase-cinema-meter__fill" style="--fill: 72%"></span>
      </div>
    </div>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT B: Utility fill
         Uses predefined fill utilities for common showcase values.
    ───────────────────────────────────────────────────────────── -->
    <div class="showcase-cinema-meter" vl-effect="fade-up" vl-timeline="view" vl-once>
      <span>[Metric label]</span>
      <div class="showcase-cinema-meter__track" aria-label="[Metric label]: 54%">
        <span class="showcase-cinema-meter__fill showcase-cinema-meter__fill--54"></span>
      </div>
    </div>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT C: Metric group
         Multiple meters sequenced together inside a panel or card.
    ───────────────────────────────────────────────────────────── -->
    <div class="showcase-cinema-panel" vl-children="stagger" vl-stagger="120ms">
      <p class="showcase-ref-label">[Metric group]</p>
      <div class="showcase-cinema-meter">
        <span>[Metric label]</span>
        <div class="showcase-cinema-meter__track" aria-label="[Metric label]: 68%">
          <span class="showcase-cinema-meter__fill showcase-cinema-meter__fill--68"></span>
        </div>
      </div>
      <div class="showcase-cinema-meter">
        <span>[Metric label]</span>
        <div class="showcase-cinema-meter__track" aria-label="[Metric label]: 46%">
          <span class="showcase-cinema-meter__fill showcase-cinema-meter__fill--46"></span>
        </div>
      </div>
      <div class="showcase-cinema-meter">
        <span>[Metric label]</span>
        <div class="showcase-cinema-meter__track" aria-label="[Metric label]: 28%">
          <span class="showcase-cinema-meter__fill showcase-cinema-meter__fill--28"></span>
        </div>
      </div>
    </div>

    <!-- ─────────────────────────────────────────────────────────
         REFERENCE: Live example (from landing.html)
    ───────────────────────────────────────────────────────────── -->
    <div class="showcase-cinema-meter">
      <span>Surface Shift</span>
      <div class="showcase-cinema-meter__track">
        <span class="showcase-cinema-meter__fill showcase-cinema-meter__fill--72"></span>
      </div>
    </div>

  </body>
</html>
