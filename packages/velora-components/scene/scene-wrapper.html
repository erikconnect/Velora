<!DOCTYPE html>
<!--
  VELORA COMPONENT — Scene Wrapper
  ─────────────────────────────────────────────────────────────
  The foundational structure for all cinematic sections.
  Provides the scroll-timeline anchor, scene preset slot,
  and inner layout variants.

  API:
    vl-scene        preset name (cinematic-hero | sticky-story |
                    glass-bento | product-reveal | editorial-cinema)
    vl-effect       entry effect (fade-up | reveal-cinematic |
                    depth-enter | mask-sweep | wipe-reveal | glide-in)
    vl-timeline     always "view" for scene-level sections
    vl-once         optional — fires entry only once

  Inner variants (class on .showcase-cinema-scene__inner):
    --split         two-column: copy left, stage right
    --editorial     centered editorial column with breakout mark
    --payoff        payoff / CTA centered block
    (no modifier)   single-column, section-width default

  Accessibility:
    - Section must have a unique `id` for bussola/anchor nav
    - Add view-timeline-name on the section for bussola sync:
        style="view-timeline-name: --tl-N; view-timeline-axis: block;"
    - prefers-reduced-motion: vl-effect falls back to opacity-only

  CSS layers consumed:
    velora.motion → @layer velora.scene, velora.effects
    velora.components → @layer velora.showcase
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Wrapper — Velora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/src/velora.css" />
  </head>
  <body>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT A: Split (copy + stage)
         Use for hero scenes with visual stage on the right.
    ───────────────────────────────────────────────────────────── -->
    <section
      id="scene-[n]"
      class="showcase-cinema-scene showcase-cinema-scene--[page]-[act]"
      vl-scene="cinematic-hero"
      data-vl-scene-mode="full-bleed"
      data-vl-scene-density="immersive"
      vl-effect="reveal-cinematic"
      vl-timeline="view"
      vl-once
      style="view-timeline-name: --tl-1; view-timeline-axis: block;"
    >
      <div class="showcase-cinema-scene__inner showcase-cinema-scene__inner--split">
        <!-- Scene Copy Block → see scene-copy.html -->
        <div class="showcase-cinema-copy" vl-children="orchestrate" vl-stagger="120ms">
          <!-- content here -->
        </div>
        <!-- Scene Stage → see scene-stage.html -->
        <div class="showcase-cinema-stage" aria-label="[Describe visual content]">
          <!-- visual content here -->
        </div>
      </div>
    </section>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT B: Single column (header + content grid)
         Use for system/reference sections with full-width grids.
    ───────────────────────────────────────────────────────────── -->
    <section
      id="scene-[n]"
      class="showcase-cinema-scene showcase-cinema-scene--[page]-[act]"
      vl-scene="glass-bento"
      data-vl-scene-density="balanced"
      vl-effect="fade-up"
      vl-timeline="view"
      vl-once
      style="view-timeline-name: --tl-2; view-timeline-axis: block;"
    >
      <div class="showcase-cinema-scene__inner">
        <!-- Scene Header (act intro) -->
        <div class="showcase-cinema-scene__header" vl-children="orchestrate" vl-stagger="100ms">
          <div>
            <p class="showcase-ref-kicker">Act N // [Label]</p>
            <h2 class="showcase-cinema-heading">[Section heading].</h2>
          </div>
          <p class="showcase-ref-lead">[Supporting paragraph.]</p>
        </div>
        <!-- Grid content here -->
      </div>
    </section>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT C: Editorial
         Use for quote/manifesto sections with large typographic mark.
    ───────────────────────────────────────────────────────────── -->
    <section
      id="scene-[n]"
      class="showcase-cinema-scene showcase-cinema-scene--[page]-[act]"
      vl-scene="editorial-cinema"
      data-vl-scene-density="editorial"
      vl-effect="mask-sweep"
      vl-timeline="view"
      vl-once
      style="view-timeline-name: --tl-3; view-timeline-axis: block;"
    >
      <div class="showcase-cinema-scene__inner showcase-cinema-scene__inner--editorial" vl-effect="aurora">
        <div class="showcase-cinema-editorial-mark" vl-effect="reveal-3d" vl-timeline="view" vl-range="entry-short" vl-speed="cinema">V</div>
        <blockquote class="showcase-cinema-editorial-quote">
          <p vl-effect="text-word-rise" vl-timeline="view" vl-range="scene-soft" vl-speed="cinema">
            "[Editorial quote text here.]"
          </p>
          <footer vl-children="sequence" vl-stagger="120ms">
            <strong>[Author or source]</strong>
            <span>[Context line]</span>
          </footer>
        </blockquote>
      </div>
    </section>

    <!-- ─────────────────────────────────────────────────────────
         VARIANT D: Payoff (CTA closer)
         Use as the last section in a page to drive action.
    ───────────────────────────────────────────────────────────── -->
    <section
      id="scene-payoff"
      class="showcase-cinema-scene showcase-cinema-scene--[page]-payoff"
      vl-scene="sticky-story"
      data-vl-scene-density="editorial"
      vl-effect="fade-up"
      vl-timeline="view"
      vl-once
      style="view-timeline-name: --tl-5; view-timeline-axis: block;"
    >
      <div class="showcase-cinema-scene__inner showcase-cinema-scene__inner--payoff" vl-children="orchestrate" vl-stagger="120ms">
        <p class="showcase-ref-kicker">Act N // Applied</p>
        <h2 class="showcase-cinema-heading">[Payoff heading.]</h2>
        <p class="showcase-ref-lead">[Closing action paragraph.]</p>
        <div class="showcase-cinema-payoff-links">
          <a class="showcase-ref-tokens-button showcase-ref-tokens-button--primary" href="[url]">[Primary CTA]</a>
          <a class="showcase-ref-tokens-button" href="[url]">[Secondary CTA]</a>
        </div>
      </div>
    </section>

  </body>
</html>
