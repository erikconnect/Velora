<!DOCTYPE html>
<!--
  Velora -- Header 1 (Centered Hero)
  CSS approach:
    * vl-children="stagger" on parent triggers staggered vl-fade-up on all children
    * vl-effect="blur-in" on h1 for the cinematic headline entrance
    * .vl-kicker for the eyebrow line (replaces Relume tagline <p>)
    * .vl-cta + .vl-cta--ghost for the two CTA buttons
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora -- Header 1 (Centered Hero)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/src/velora.css" />

    <style>
      .hero-headline {
        font-family: var(--vl-font-family-display);
        font-size: var(--vl-font-size-4xl);
        font-weight: var(--vl-font-weight-bold);
        line-height: var(--vl-leading-tight);
        letter-spacing: var(--vl-tracking-tight);
        margin-bottom: var(--vl-space-md);
      }
    </style>
  </head>

  <body style="min-height: 100vh; display: flex; flex-direction: column;">

    <section class="vl-section" style="flex: 1; display: flex; align-items: center;">
      <div class="vl-container vl-container--narrow" style="text-align: center;">

        <!-- vl-children="stagger" applies vl-fade-up with staggered delays to direct children -->
        <div vl-children="stagger">

          <p class="vl-kicker" style="justify-content: center;">Tagline</p>

          <h1 class="hero-headline vl-text-gradient">Short heading here</h1>

          <p style="color: var(--vl-text-secondary); margin-bottom: var(--vl-space-lg);">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse
            varius enim in eros elementum tristique.
          </p>

          <div class="vl-cluster" style="justify-content: center;">
            <a href="#" class="vl-cta">Get started</a>
            <a href="#" class="vl-cta vl-cta--ghost">Learn more</a>
          </div>

        </div>

      </div>
    </section>

  </body>
</html>
